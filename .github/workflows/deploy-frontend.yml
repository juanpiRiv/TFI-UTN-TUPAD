name: Deploy frontend

# Publica el frontend en Cloudflare Pages cuando cambia main.
# Para correrlo a mano: pestaña Actions > Deploy frontend > Run workflow.
on:
  push:
    branches: [main]
    paths:
      - frontend/**
      - pnpm-lock.yaml
      - .github/workflows/deploy-frontend.yml
  workflow_dispatch:

# Un deploy a la vez; si entra otro, se espera al que está corriendo.
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      # Vacío (lo normal) = el sitio usa la API de VITE_API_URL. Con módulos, esos se simulan con MSW.
      VITE_MOCK_MODULES: ${{ vars.VITE_MOCK_MODULES }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint, tests y build
        run: |
          pnpm --filter frontend lint
          pnpm --filter frontend test
          pnpm --filter frontend build

      # El proyecto de Pages tiene que existir en la cuenta de los secrets. Si no está, se crea: así el workflow
      # no depende de un paso manual y no falla con "The Pages project does not exist".
      - name: Crear el proyecto de Pages si no existe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'tfi-tupad' }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT")
          if [ "$status" = "200" ]; then
            echo "El proyecto $PAGES_PROJECT ya existe."
          elif [ "$status" = "404" ]; then
            echo "El proyecto $PAGES_PROJECT no existe en esta cuenta: se crea."
            pnpm dlx wrangler@4 pages project create "$PAGES_PROJECT" --production-branch=main
          else
            echo "No se pudo consultar el proyecto (HTTP $status): revisar el token y el ID de la cuenta."
            exit 1
          fi

      # wrangler-action intenta instalar wrangler con `pnpm add` en la raíz del workspace y pnpm lo rechaza
      # (ERR_PNPM_ADDING_TO_ROOT). Con `pnpm dlx` no se toca el workspace.
      - name: Publicar en Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'tfi-tupad' }}
        run: pnpm dlx wrangler@4 pages deploy frontend/dist --project-name="$PAGES_PROJECT" --branch=main

      # Deja anotada en el resumen de la corrida la dirección pública del sitio (no es un dato secreto).
      - name: Anotar la dirección del sitio
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'tfi-tupad' }}
        run: |
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT" \
            | python3 -c "import json,sys;r=json.load(sys.stdin).get('result') or {};print('Sitio: https://%s' % r.get('subdomain'));print('Dominios:', r.get('domains'))" | tee -a "$GITHUB_STEP_SUMMARY"
