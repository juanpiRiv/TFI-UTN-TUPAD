services:
  db:
    image: postgres:16
    container_name: tfi-postgres
    environment:
      POSTGRES_USER: tfi
      POSTGRES_PASSWORD: tfi
      POSTGRES_DB: tfi_finanzas
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tfi -d tfi_finanzas"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
