# nginx para el frontend estatico: SPA con fallback a index.html.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Assets con hash de Vite: se pueden cachear para siempre
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Todo lo que no es un archivo real resuelve a index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
