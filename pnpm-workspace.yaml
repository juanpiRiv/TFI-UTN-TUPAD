packages:
  - backend
  - frontend

# Paquetes con scripts de instalacion permitidos (argon2 compila un binario nativo)
allowBuilds:
  argon2: true

# Scripts que no hacen falta:
# - msw solo copia su service worker, que ya esta versionado en frontend/public
# - prisma, @prisma/engines y esbuild funcionan sin sus scripts (el cliente se genera con prisma generate)
ignoredBuiltDependencies:
  - '@prisma/engines'
  - esbuild
  - msw
  - prisma
